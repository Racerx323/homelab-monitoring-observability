---
name: Repository validation

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  munin:
    name: Munin scaffold validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homelab-monitoring-observability
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: homelab-monitoring-observability
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: Racerx323/homelab-ntp
          ref: a611d775ff6e87d1172b2cd3a21321ab8cca614c
          path: homelab-ntp
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: Racerx323/homelab-network
          ref: 87dd9913073de0d7bc942f9abe23e62994d46a09
          path: homelab-network
          persist-credentials: false
      - name: Validate candidate profile and plugins
        run: bash Munin/tests/validate-scaffold.sh
      - name: Apache ACL transaction offline contracts
        run: python3 -I -B Apache2/tests/test_deploy_acl.py

  baseline:
    name: Baseline validation
    uses: >-
      Racerx323/homelab-docs/.github/workflows/reusable-validation.yml@7d09aae0bdf0fe80bc10263d1e8e5c682037d848
