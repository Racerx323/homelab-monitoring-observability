# Start of the VirtualHost definition. This block applies to any IP address (*) on port 80 (standard HTTP).
# File location: /etc/apache2/sites-available/munin.theama.co.conf
<VirtualHost *:80>
    # Munin configuration for apache2
    #
    # Apache can serve munin's files that are either statically generated
    # (in a cron job) or generated on demand (via cgi).
    # The relevant munin settings are "html_strategy" and "graph_strategy".
    # The related apache settings can be adjusted at the end of this file.
    #
    # See /usr/share/doc/munin/README.Debian for details.

    # ***** SETTINGS FOR THIS VIRTUAL HOST (REQUIRED) *****
    # Email address for the server administrator, often shown on error pages.
    ServerAdmin system@theama.me
    # The primary hostname for this virtual host. Apache will use this block for requests to this name.
    ServerName J1-SVMF.munin.local.theama.co
    # An alternative name for this virtual host. Requests to "munin" (if DNS resolves) will also be handled here.
    ServerAlias munin

    # ***** SETTINGS FOR LOGGING (OPTIONAL) *****
    # Sets the logging level for this virtual host. "warn" logs warnings and more severe errors.
    LogLevel warn
    # Specifies the file where error messages for this virtual host will be logged.
    ErrorLog /var/log/apache2/munin.local.theama.co-error.log
    # Specifies the file for access logs (who accessed what) and uses the "combined" log format.
    CustomLog /var/log/apache2/munin.local.theama.co-access.log combined

    # ***** MUNIN CGI & STATIC CONTENT SETTINGS (REQUIRED) *****
    # Alias for Munin's generated static content (CSS, JS, etc. for the HTML pages).
    # Maps the URL /munin/static/ to the filesystem directory /var/cache/munin/www/static/
    Alias /munin/static/ /var/cache/munin/www/static/

    # Configuration for Munin's core static files directory (defined by 'staticdir' in munin.conf).
    # These are typically default CSS, JavaScript, and images used by the Munin system itself,
    # separate from the generated HTML output's static files in /var/cache/munin/www.
    <Directory /etc/munin/static>
        # Allows access from any IP address to these core static files.
        # This is generally safe as these are non-sensitive, public assets.
        Require all granted
    </Directory>

    # Configuration for the directory containing Munin's generated static files.
    <Directory /var/cache/munin/www>
        # Allows access from any IP address to the static files generated by Munin (HTML, CSS, JS).
        # For restricted access, you might change this to 'Require local' or 'Require ip 1.2.3.4'.
        Require all granted
        # Allows Apache to follow symbolic links within this directory if the link and target are owned by the same user.
        Options FollowSymLinks SymLinksIfOwnerMatch
    </Directory>

    # Maps the URL prefix /munin-cgi/munin-cgi-html to the munin-cgi-html script.
    # This script is responsible for generating the main HTML pages for Munin.
    ScriptAlias /munin-cgi/munin-cgi-html /usr/lib/munin/cgi/munin-cgi-html
    # Applies settings to URLs starting with /munin/ but NOT /munin/static/
    # The (?!static/) is a negative lookahead, ensuring this doesn't apply to the Alias above.
    # This handles requests for the main Munin HTML pages.
    # Note: The RewriteRules below aim to make Munin accessible at the root, potentially making direct access via /munin/ less common.
    <LocationMatch "^/munin/(?!static/)">
        # Allows access from any IP address to the Munin HTML CGI script via this path.
        Require all granted
        Options FollowSymLinks SymLinksIfOwnerMatch
        # If mod_fcgid (FastCGI) is loaded, handle these as FastCGI scripts.
        <IfModule mod_fcgid.c>
            SetHandler fcgid-script
        </IfModule>
        # If mod_fcgid is NOT loaded, fall back to standard CGI.
        <IfModule !mod_fcgid.c>
            SetHandler cgi-script
        </IfModule>
    </LocationMatch>

    # Maps the URL prefix /munin-cgi/munin-cgi-graph to the munin-cgi-graph script.
    # This script is responsible for generating graph images on demand.
    ScriptAlias /munin-cgi/munin-cgi-graph /usr/lib/munin/cgi/munin-cgi-graph
    # Applies settings to the URL /munin-cgi/munin-cgi-graph.
    # This handles requests for Munin graph images.
    <Location /munin-cgi/munin-cgi-graph>
        # Allows access from any IP address to the Munin graph CGI script via this path.
        Require all granted
        Options FollowSymLinks SymLinksIfOwnerMatch
        # If mod_fcgid (FastCGI) is loaded, handle as FastCGI.
        <IfModule mod_fcgid.c>
            SetHandler fcgid-script
        </IfModule>
        # If mod_fcgid is NOT loaded, fall back to standard CGI.
        <IfModule !mod_fcgid.c>
            SetHandler cgi-script
        </IfModule>
    </Location>

    # ***** GENERAL REWRITE RULES (mod_rewrite) (OPTIONAL BUT RECOMMENDED) *****
    # Enables the Apache rewrite engine for URL manipulation.
    # Note: Alias and ScriptAlias directives are typically processed before RewriteRules.
    # These rules allow accessing Munin directly from the server's root URL
    # (e.g., http://yourserver/ instead of http://yourserver/munin-cgi).
    RewriteEngine On

    # Rule for serving the favicon.ico from a general static directory.
    # If the request is for /favicon.ico (at the root of this virtual host),
    # serve the file from /etc/munin/static/favicon.ico.
    # [L] means this is the Last rule to process if it matches.
    # This rule serves the favicon (website icon) for the Munin site.
    RewriteRule ^/favicon.ico /var/cache/munin/www/static/favicon.ico [L]

    # Rule for serving other static content from /static/ at the root.
    # If the request starts with /static/ (e.g., /static/style.css),
    # serve the corresponding file from /etc/munin/static/.
    # (.*) captures the part of the URL after /static/ and $1 reuses it.
    # This rule serves static files like CSS and JavaScript from the Munin site.
    # Note: This is different from /munin/static/, which is handled by the Alias directive.
    RewriteRule ^/static/(.*) /var/cache/munin/www/static/$1          [L]

    # Rule for handling requests for HTML pages.
    # If the request ends with .html, it's passed to the munin-cgi-html script.
    # [PT] means "pass through" - the rewritten URL is passed to the next stage of processing.
    RewriteRule ^(/.*\.html)?$ /munin-cgi/munin-cgi-html/$1 [PT]

    # Rules for handling image requests.
    # This first rule rewrites requests to /munin-cgi/munin-cgi-graph/(.*) to /$1.
    RewriteRule ^/munin-cgi/munin-cgi-graph/(.*) /$1
    # This condition ensures the following rule only applies if the request is NOT for a file in /static/.
    RewriteCond %{REQUEST_URI} !^/static
    # This rule rewrites requests for .png files to the munin-cgi-graph script.
    # [L,PT] means this is the Last rule and the rewritten URL is passed through.
    RewriteRule ^/(.*.png)$ /munin-cgi/munin-cgi-graph/$1 [L,PT]

    # ***** DIRECTORY SETTINGS FOR CGI SCRIPTS *****
    # This block applies specific configurations to the filesystem directory /usr/lib/munin/cgi,
    # where the actual CGI scripts (munin-cgi-html, munin-cgi-graph) reside.
    <Directory "/usr/lib/munin/cgi">
        Require all granted
        # Allows CGI scripts to be executed in this directory. This is crucial for ScriptAlias to work.
        Options +ExecCGI +SymLinksIfOwnerMatch
        # This block applies if the mod_fcgid module (for FastCGI) is loaded.
        # These SetHandler directives in <Directory> act as a default for scripts in this path
        # if not overridden by a <Location> or <LocationMatch> block for a specific URL.
        <IfModule mod_fcgid.c>
            # Sets files in this directory to be handled by the fcgid-script handler (as FastCGI scripts).
            SetHandler fcgid-script
        </IfModule>
        # This block applies if the mod_fcgid module is NOT loaded.
        <IfModule !mod_fcgid.c>
            # Sets files in this directory to be handled by the cgi-script handler (as standard CGI scripts).
            SetHandler cgi-script
        </IfModule>
    </Directory>
</VirtualHost>
