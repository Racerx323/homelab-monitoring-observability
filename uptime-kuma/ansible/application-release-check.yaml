---
- name: Install the approved release check on the Kuma Pi
  hosts: uptime_kuma
  become: true
  gather_facts: false
  vars:
    source_dir: '{{ playbook_dir }}/../operations/application-upgrade'
  tasks:
    - name: Identify the target
      ansible.builtin.command: hostname -s
      register: hostname
      changed_when: false
    - name: Bind the Pi and explicit installation approval
      ansible.builtin.assert:
        that:
          - hostname.stdout == 'j2-svpi3bmf'
          - activate_check | default(false) | bool
    - name: Install the checker
      ansible.builtin.copy:
        src: '{{ source_dir }}/release.py'
        dest: /usr/local/libexec/kuma-release-check.py
        mode: '0755'
    - name: Install service and timer
      ansible.builtin.copy:
        src: '{{ source_dir }}/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        mode: '0644'
      loop:
        - kuma-release-check.service
        - kuma-release-check.timer
    - name: Run notification-free discovery
      ansible.builtin.command: /usr/bin/python3 -IB /usr/local/libexec/kuma-release-check.py --dry-run
      changed_when: false
    - name: Confirm delivery to the reviewed fleet route
      ansible.builtin.command: /usr/bin/python3 -IB /usr/local/libexec/kuma-release-check.py --confirm-delivery
      changed_when: true
    - name: Enable the weekly schedule
      ansible.builtin.systemd_service:
        name: kuma-release-check.timer
        daemon_reload: true
        enabled: true
        state: started
