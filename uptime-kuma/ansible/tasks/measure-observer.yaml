---
- name: Sample available memory without a remote Python module before the command
  ansible.builtin.raw: /usr/bin/awk '/^MemAvailable:/ {print $2}' /proc/meminfo; /usr/bin/date --iso-8601=ns
  register: capacity_raw_before
  changed_when: false
- name: Reproduce the deployment gate's Python-backed memory command
  ansible.builtin.command:
    argv: [/usr/bin/awk, '/^MemAvailable:/ {print $2}', /proc/meminfo]
  register: capacity_python_command
  changed_when: false
- name: Sample available memory without a remote Python module after the command
  ansible.builtin.raw: /usr/bin/awk '/^MemAvailable:/ {print $2}' /proc/meminfo; /usr/bin/date --iso-8601=ns
  register: capacity_raw_after
  changed_when: false
- name: Preserve the paired observations without correcting the admission floor
  ansible.builtin.copy:
    content: >-
      {{ {'pair': capacity_pair, 'raw_before': capacity_raw_before.stdout_lines,
          'command': capacity_python_command.stdout, 'command_start': capacity_python_command.start,
          'command_end': capacity_python_command.end, 'raw_after': capacity_raw_after.stdout_lines,
          'limitation': 'Paired differences include other activity; no assumed overhead is subtracted.'} | to_nice_json }}
    dest: '{{ operation_evidence_directory }}/observer-pair-{{ capacity_pair }}.json'
    mode: '0600'
  delegate_to: localhost
  become: false
- name: Require complete numeric memory readings
  ansible.builtin.assert:
    that:
      - capacity_raw_before.stdout_lines[0] is match('^[0-9]+$')
      - capacity_python_command.stdout is match('^[0-9]+$')
      - capacity_raw_after.stdout_lines[0] is match('^[0-9]+$')
