---
- name: Independently verify accepted guarded startup and disabled pending containment
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import hashlib,json,pathlib,stat,subprocess
        root=pathlib.Path('/var/lib/uptime-kuma-maintenance/remaining-deployment')
        state=json.loads((root/'state.json').read_text())
        assert state['status']=='accepted' and state['reboot_count']==1
        if 'original_predecessor_sha256' in state:
            authority=pathlib.Path('/var/lib/uptime-kuma-maintenance/remaining-deployment')
            for name,key in [('previous-state.json','original_predecessor_sha256'),('completion-state.json','predecessor_sha256')]:
                p=authority/name; info=p.lstat()
                assert not any(x.is_symlink() for x in (p,*p.parents))
                assert stat.S_ISREG(info.st_mode) and info.st_uid==info.st_gid==0 and stat.S_IMODE(info.st_mode)==0o600
                assert hashlib.sha256(p.read_bytes()).hexdigest()==state[key]
        assert (root/'accepted').is_file() and not (root/'contained').exists()
        result={'state':state,'units':{}}
        for unit in ['uptime-kuma.service','uptime-kuma-network.service','uptime-kuma-loopback.socket','uptime-kuma-loopback.service','webmin.service']:
            props=dict(x.split('=',1) for x in subprocess.check_output(['systemctl','show',unit,'--property=ActiveState,Requires,After'],text=True).splitlines())
            assert props['ActiveState']=='active',unit
            assert 'uptime-kuma-startup-permit.service' in props['Requires'].split(),unit
            assert 'uptime-kuma-startup-permit.service' in props['After'].split(),unit
            if unit!='webmin.service':
                guard=pathlib.Path('/etc/systemd/system')/(unit+'.d/50-network-diagnostic-guard.conf')
                assert guard.read_bytes()==b'[Unit]\nConditionPathExists=/run/uptime-kuma-network-diagnostic/permit\n'
            result['units'][unit]=props
        timer=dict(x.split('=',1) for x in subprocess.check_output(['systemctl','show','uptime-kuma-deployment-containment.timer','--property=ActiveState,UnitFileState'],text=True).splitlines())
        assert timer=={'ActiveState':'inactive','UnitFileState':'disabled'},timer
        result['timer']=timer
        print(json.dumps(result))
  changed_when: false
  register: kuma_startup_verification
- name: Retain independent final startup verification
  ansible.builtin.copy:
    content: '{{ kuma_startup_verification.stdout }}'
    dest: '{{ operation_evidence_directory }}/startup-verification.json'
    mode: '0600'
  delegate_to: localhost
  become: false
